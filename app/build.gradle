plugins { id 'com.android.application' }

android { namespace 'com.crisalida.codx'; compileSdk 35
    defaultConfig { applicationId 'com.crisalida.codx'; minSdk 26; targetSdk 35; versionCode 3; versionName '3.0.0' }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}

dependencies { implementation 'androidx.work:work-runtime:2.9.1'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.13' }
